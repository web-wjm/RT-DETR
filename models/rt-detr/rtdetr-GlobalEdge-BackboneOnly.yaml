# RT-DETR-R18 with GlobalEdge backbone-only ablation.
# The multiscale edge branch and backbone ConvEdgeFusion layers are kept.
# The original RT-DETR neck is used without the final edge fusion layers.

nc: 6
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4

  - [-1, 1, MutilScaleEdgeInfoGenetator, [[64, 128, 256]]] # 4
  - [4, 1, GetIndexOutput, [0]] # 5-edge P3/8
  - [4, 1, GetIndexOutput, [1]] # 6-edge P4/16
  - [4, 1, GetIndexOutput, [2]] # 7-edge P5/32

  - [3, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 8
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']] # 9-P3/8
  - [[5, -1], 1, ConvEdgeFusion, [128]] # 10-P3/8
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']] # 11-P4/16
  - [[6, -1], 1, ConvEdgeFusion, [256]] # 12-P4/16
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']] # 13-P5/32
  - [[7, -1], 1, ConvEdgeFusion, [512]] # 14-P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 15 input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 16
  - [-1, 1, Conv, [256, 1, 1]] # 17 Y5

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 18 P5->P4
  - [12, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 19 input_proj.1
  - [[-2, -1], 1, Concat, [1]] # 20
  - [-1, 3, RepC3, [256, 0.5]] # 21 fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]] # 22 Y4

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 23 P4->P3
  - [10, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 24 input_proj.0
  - [[-2, -1], 1, Concat, [1]] # 25
  - [-1, 3, RepC3, [256, 0.5]] # 26 X3

  - [-1, 1, Conv, [256, 3, 2]] # 27 downsample P3->P4
  - [[-1, 22], 1, Concat, [1]] # 28
  - [-1, 3, RepC3, [256, 0.5]] # 29 F4

  - [-1, 1, Conv, [256, 3, 2]] # 30 downsample P4->P5
  - [[-1, 17], 1, Concat, [1]] # 31
  - [-1, 3, RepC3, [256, 0.5]] # 32 F5

  - [[26, 29, 32], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]] # Detect
