# RT-DETR-R18 with GlobalEdge neck-output-only ablation.
# The edge branch is generated from the stem, but edge fusion is applied
# only to the three final Neck outputs before the decoder.

nc: 6
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4

  - [-1, 1, MutilScaleEdgeInfoGenetator, [[64, 128, 256]]] # 4
  - [4, 1, GetIndexOutput, [0]] # 5-edge P3/8
  - [4, 1, GetIndexOutput, [1]] # 6-edge P4/16
  - [4, 1, GetIndexOutput, [2]] # 7-edge P5/32

  # Original R18 backbone without intermediate edge fusion.
  - [3, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 8
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']] # 9-P3/8
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']] # 10-P4/16
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']] # 11-P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 12 input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 13
  - [-1, 1, Conv, [256, 1, 1]] # 14 Y5

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 15 P5->P4
  - [10, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 16 input_proj.1
  - [[-2, -1], 1, Concat, [1]] # 17
  - [-1, 3, RepC3, [256, 0.5]] # 18 fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]] # 19 Y4

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 20 P4->P3
  - [9, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 21 input_proj.0
  - [[-2, -1], 1, Concat, [1]] # 22
  - [-1, 3, RepC3, [256, 0.5]] # 23 X3

  - [-1, 1, Conv, [256, 3, 2]] # 24 downsample P3->P4
  - [[-1, 19], 1, Concat, [1]] # 25
  - [-1, 3, RepC3, [256, 0.5]] # 26 F4

  - [-1, 1, Conv, [256, 3, 2]] # 27 downsample P4->P5
  - [[-1, 14], 1, Concat, [1]] # 28
  - [-1, 3, RepC3, [256, 0.5]] # 29 F5

  # Edge fusion is used only at the final Neck outputs.
  - [[5, 23], 1, ConvEdgeFusion, [256]] # 30 P3/8
  - [[6, 26], 1, ConvEdgeFusion, [256]] # 31 P4/16
  - [[7, 29], 1, ConvEdgeFusion, [256]] # 32 P5/32

  - [[30, 31, 32], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]] # Detect
