# RT-DETR-R18 with dual-scale AIFI and Inner-GIoU localization loss.
#
# Ablation configuration:
# - P5/32 and P4/16 are independently encoded by standard AIFI layers.
# - The original Conv + RepC3 neck is retained (SlimNeck NOT enabled).
# - Inner-GIoU (ratio 0.7) replaces the default GIoU localization loss;
#   it is enabled only because iou_loss is set to inner_giou below.

nc: 10
iou_loss: inner_giou
inner_iou_ratio: 0.7   # tunable: sweep 0.5 / 0.6 / 0.8

scales:
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4

  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 4-P2/4
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']] # 5-P3/8
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']] # 6-P4/16
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']] # 7-P5/32

head:
  # P5 intra-scale encoding (standard RT-DETR path).
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 8 P5 projection
  - [-1, 1, AIFI, [1024, 8]] # 9 AIFI(P5)
  - [-1, 1, Conv, [256, 1, 1]] # 10 Y5

  # Additional P4 intra-scale encoding.
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 11 P4 projection
  - [-1, 1, AIFI, [1024, 8]] # 12 AIFI(P4)
  - [-1, 1, Conv, [256, 1, 1]] # 13 Y4 encoded

  # Original RT-DETR top-down feature fusion.
  - [10, 1, nn.Upsample, [None, 2, 'nearest']] # 14 Y5 -> P4
  - [[-1, 13], 1, Concat, [1]] # 15
  - [-1, 3, RepC3, [256, 0.5]] # 16
  - [-1, 1, Conv, [256, 1, 1]] # 17 Y4

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 18 Y4 -> P3
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 19 P3 projection
  - [[-2, -1], 1, Concat, [1]] # 20
  - [-1, 3, RepC3, [256, 0.5]] # 21 P3 output

  # Original RT-DETR bottom-up feature fusion.
  - [-1, 1, Conv, [256, 3, 2]] # 22 P3 -> P4
  - [[-1, 17], 1, Concat, [1]] # 23
  - [-1, 3, RepC3, [256, 0.5]] # 24 P4 output

  - [-1, 1, Conv, [256, 3, 2]] # 25 P4 -> P5
  - [[-1, 10], 1, Concat, [1]] # 26
  - [-1, 3, RepC3, [256, 0.5]] # 27 P5 output

  - [[21, 24, 27], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]] # 28 Detect(P3, P4, P5)
